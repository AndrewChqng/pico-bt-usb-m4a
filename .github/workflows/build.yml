name: Build UF2 Firmware & Run Verification Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  host-tests:
    name: Host Verification Suite (LATM + M4A + FAT32 + FFmpeg)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Build and Run Host Test Suite
        run: |
          mkdir build-tests
          cd build-tests
          cmake -DBUILD_HOST_TESTS=ON ..
          make -j$(nproc)
          ctest --output-on-failure -V

  firmware-uf2:
    name: Build Pico W / WH Firmware (.uf2)
    runs-on: ubuntu-latest
    needs: host-tests
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM Toolchain & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib python3

      - name: Clone Raspberry Pi Pico SDK
        run: |
          git clone --depth 1 --branch 2.2.0 https://github.com/raspberrypi/pico-sdk.git ${RUNNER_TEMP}/pico-sdk
          cd ${RUNNER_TEMP}/pico-sdk
          git submodule update --init --depth 1

      - name: Build Firmware
        env:
          PICO_SDK_PATH: ${{ runner.temp }}/pico-sdk
        run: |
          mkdir build
          cd build
          cmake -DPICO_BOARD=pico_w ..
          make -j$(nproc)

      - name: Upload UF2 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pico_bt_usb_m4a-uf2
          path: build/pico_bt_usb_m4a.uf2
