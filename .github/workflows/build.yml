name: Build UF2 Firmware & Run Verification Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  host-tests:
    name: Host Verification Suite (LATM + M4A + FAT32 + FFmpeg)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Build and Run Host Test Suite
        run: |
          cmake -S . -B build-tests -DBUILD_HOST_TESTS=ON
          cmake --build build-tests --parallel
          ctest --test-dir build-tests --output-on-failure -V

  firmware-uf2:
    name: Build Pico W / WH Firmware (.uf2)
    runs-on: ubuntu-latest
    needs: host-tests
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM Toolchain & Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib python3

      - name: Restore Pico SDK
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pico-sdk
          key: pico-sdk-2.2.0

      - name: Prepare Raspberry Pi Pico SDK
        run: |
          if [ ! -f "${RUNNER_TEMP}/pico-sdk/pico_sdk_init.cmake" ]; then
            git clone --depth 1 --branch 2.2.0 https://github.com/raspberrypi/pico-sdk.git "${RUNNER_TEMP}/pico-sdk"
            git -C "${RUNNER_TEMP}/pico-sdk" submodule update --init --depth 1
          fi

      - name: Build Firmware
        env:
          PICO_SDK_PATH: ${{ runner.temp }}/pico-sdk
        run: |
          cmake -S . -B build -DPICO_SDK_PATH="${PICO_SDK_PATH}" -DPICO_BOARD=pico_w
          cmake --build build --parallel

      - name: Upload UF2 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pico_bt_usb_m4a-uf2
          path: build/pico_bt_usb_m4a.uf2
